name: JuCoding V4 Branch Check

on:
  push:
    branches:
      - feat/jucoding-lecture-ui-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Static check
        run: npm run check

      - name: Electron app smoke
        run: xvfb-run -a npm run smoke:app

      - name: Track smoke
        run: xvfb-run -a npm run smoke:tracks

      - name: JuCoding V4 lecture smoke
        run: xvfb-run -a npm run smoke:v4

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jucoding-v4-qa
          path: artifacts/qa
          if-no-files-found: ignore
