name: JuCoding V4 Branch Check

on:
  push:
    branches:
      - feat/jucoding-lecture-ui-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Korean font for visual QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Static check
        run: npm run check

      - name: Existing Electron app smoke
        run: xvfb-run -a npm run smoke:app

      - name: Existing track smoke
        run: xvfb-run -a npm run smoke:tracks

      - name: JuCoding V4 shell smoke
        run: xvfb-run -a npm run smoke:v4:shell

      - name: JuCoding V4 lecture smoke
        run: xvfb-run -a npm run smoke:v4

      - name: Print V4 reports
        if: always()
        run: |
          echo '--- V4 SHELL REPORT ---'
          cat artifacts/qa/jucoding-shell-1366x768.json || true
          echo '--- V4 LECTURE REPORT ---'
          cat artifacts/qa/jucoding-v4-1366x768.json || true

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jucoding-v4-qa
          path: artifacts/qa
          if-no-files-found: ignore
