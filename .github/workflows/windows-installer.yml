name: JuCoding Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "build/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static validation
        run: npm run check

      - name: Build JuCoding installer
        run: npm run dist:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show installer output
        shell: pwsh
        run: Get-ChildItem -Path release -Filter *.exe | Select-Object Name,Length,LastWriteTime

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JuCoding-4.0.0-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90
