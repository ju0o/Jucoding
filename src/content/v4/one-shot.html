<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: jucoding-archive:; font-src 'self' data:;">
  <title>JuCoding · AI · Agent · 바이브코딩</title>
  <link rel="stylesheet" href="./one-shot.css">
  <link rel="stylesheet" href="./simulation.css">
</head>
<body>
  <div class="deck-shell">
    <header class="deck-top">
      <div class="brand">
        <span class="brand-cube">J</span>
        <div>
          <strong>JuCoding</strong>
          <span>AI · AGENT · VIBE CODING STUDY</span>
        </div>
      </div>
      <div class="top-actions">
        <button id="btn-home" type="button">홈으로</button>
        <button id="btn-map" type="button">전체 흐름</button>
        <button id="btn-chapters" type="button">목차</button>
        <button id="btn-notes" type="button">강사 메모</button>
      </div>
    </header>

    <main class="stage-wrap">
      <section id="stage" class="stage" aria-live="polite"></section>
      <p id="archive-notice" class="archive-notice" hidden></p>

      <aside id="speaker-cue" class="speaker-cue" aria-hidden="true">
        <div class="cue-label">강사 메모</div>
        <strong id="cue-title"></strong>
        <p id="cue-summary" class="cue-summary"></p>
        <p id="cue-body"></p>
        <div id="cue-extra" class="cue-extra"></div>
      </aside>
    </main>

    <footer class="deck-footer">
      <button id="prev" class="nav-button" type="button">← 이전</button>
      <div class="progress-area">
        <div class="meta">
          <span id="chapter-label"></span>
          <span id="scene-counter"></span>
        </div>
        <div class="progress"><i id="progress-bar"></i></div>
      </div>
      <button id="next" class="nav-button primary" type="button">다음 →</button>
    </footer>
  </div>

  <dialog id="chapter-dialog">
    <div class="dialog-head">
      <div><span>3 HOUR STUDY</span><h2>오늘의 6개 흐름</h2></div>
      <button class="close-dialog" data-close="chapter-dialog" type="button">×</button>
    </div>
    <div id="chapter-grid" class="chapter-grid"></div>
  </dialog>

  <dialog id="map-dialog">
    <div class="dialog-head">
      <div><span>MASTER FLOW</span><h2>아이디어가 실제 도구가 되는 길</h2></div>
      <button class="close-dialog" data-close="map-dialog" type="button">×</button>
    </div>
    <div class="master-map">
      <div class="map-track"><span>1</span><b>AI 이해</b><i>→</i><b>Agent 이해</b><i>→</i><b>왜 바이브코딩?</b></div>
      <div class="map-track"><span>2</span><b>Frontend</b><i>↔</i><b>API</b><i>↔</i><b>Backend</b><i>↔</i><b>Database</b></div>
      <div class="map-track"><span>3</span><b>PRD</b><i>→</i><b>WBS</b><i>→</i><b>Wireframe</b><i>→</i><b>Prototype</b></div>
      <div class="map-track"><span>4</span><b>ERD / DBML</b><i>→</i><b>SSOT</b><i>→</i><b>구현</b></div>
      <div class="map-track"><span>5</span><b>개발서버</b><i>→</i><b>배포</b><i>→</i><b>Git / GitHub</b></div>
      <div class="map-track"><span>6</span><b>Agent</b><i>→</i><b>MCP / Worker</b><i>→</i><b>영상 · SNS 자동화</b></div>
    </div>
  </dialog>

  <dialog id="asset-dialog" aria-label="강의 자료 크게 보기">
    <div class="dialog-head">
      <div><span>LECTURE MATERIAL</span><h2 id="asset-dialog-title">강의 자료</h2></div>
      <button class="close-dialog" data-close="asset-dialog" type="button">×</button>
    </div>
    <div class="asset-dialog-body">
      <img id="asset-dialog-img" alt="">
      <p id="asset-dialog-cap" class="asset-dialog-cap"></p>
    </div>
  </dialog>

  <script src="./generated/content-registry.js"></script>
  <script src="./simulation-engine.js"></script>
  <script src="./one-shot.js"></script>
</body>
</html>
